name: Daily Stock Screening

on:
  schedule:
    # UTC 7:10 = 北京时间 15:10，周一至周五执行
    - cron: '10 7 * * 1-5'
  workflow_dispatch:
    # 支持手动触发

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock screening strategy
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TZ: Asia/Shanghai
        run: python run.py

      - name: Commit signal history (if updated)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/signal_history.csv data/tracking_report.csv || true
          git diff --cached --quiet || git commit -m "chore: update signal history [skip ci]"
          git push || true
