name: Daily Stock Screening

on:
  schedule:
    # UTC 13:00 = 北京时间 21:00（收盘后 6 小时，确保 Baostock 当日数据已完整入库；
    # Baostock 一般 17:30 起陆续更新，20:00 前完成，21:00 起跑留足安全边际）
    - cron: "0 13 * * 1-5"
  workflow_dispatch:
    inputs:
      no_cache:
        description: "跳过 cache/ 磁盘缓存，强制拉最新数据"
        type: boolean
        default: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 缓存 baostock 磁盘缓存目录。数据层按文件 mtime 判新鲜度，而 actions/cache
      # 基于 tar 会保留 mtime，因此恢复的「昨日行情」会被正确判定为过期并重新拉取，
      # 仍在 TTL 内的股票列表（6天）与基本面（7天）则直接复用，省下大量请求。
      - name: Resolve cache date
        id: cachedate
        run: echo "ymd=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Cache baostock data
        uses: actions/cache@v4
        with:
          path: cache
          key: baostock-cache-${{ steps.cachedate.outputs.ymd }}
          restore-keys: |
            baostock-cache-

      - name: Run strategy
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          # Baostock 的 query_all_stock(day=...) 与缓存「当天」判断依赖本地日期；
          # 用北京时间避免 UTC 时区在跨日边界产生偏差。
          TZ: Asia/Shanghai
          # 关闭 stdout 缓冲：否则 Python 输出按块缓冲，任务超时/取消后缓冲的日志全部丢失
          PYTHONUNBUFFERED: "1"
          NO_CACHE: ${{ inputs.no_cache }}
        run: |
          if [ "$NO_CACHE" = "true" ]; then
            echo "::notice::手动触发已勾选 no_cache，本次跳过 cache/ 磁盘缓存"
            python -u run.py --no-cache
          else
            python -u run.py
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screening-data-${{ github.run_number }}
          path: data/
          retention-days: 30
