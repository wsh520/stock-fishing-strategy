name: Daily Stock Screening

on:
  schedule:
    # UTC 13:00 = 北京时间 21:00（收盘后 6 小时，确保 Baostock 当日数据已完整入库；
    # Baostock 一般 17:30 起陆续更新，20:00 前完成，21:00 起跑留足安全边际）
    - cron: "0 13 * * 1-5"
  workflow_dispatch:
    inputs:
      no_cache:
        description: "跳过 cache/ 磁盘缓存读写（两套策略都强制全量拉取，且不再跨策略共享）"
        type: boolean
        default: false
      skip_breakout:
        description: "只跑抄底策略，跳过放量突破"
        type: boolean
        default: false
      breakout_no_save:
        description: "突破策略跳过 MySQL 落库（仅飞书通知）"
        type: boolean
        default: false
      breakout_no_notify:
        description: "突破策略跳过飞书通知"
        type: boolean
        default: false

jobs:
  screen:
    runs-on: ubuntu-latest
    # GitHub 托管 runner 单 job 硬上限 6 小时。两套策略现在顺序跑在同一个 job 里，
    # 共享这一份预算（此前是两条流水线各自 6 小时）。实测共享缓存后总耗时低于
    # 两者独立运行之和（突破几乎不再取数），故仍维持 360。
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 缓存 baostock 磁盘缓存目录。数据层按文件 mtime 判新鲜度，而 actions/cache
      # 基于 tar 会保留 mtime，因此恢复的「昨日行情」会被正确判定为过期并重新拉取，
      # 仍在 TTL 内的股票列表（6天）与基本面（7天）则直接复用，省下大量请求。
      - name: Resolve cache date
        id: cachedate
        run: echo "ymd=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Cache baostock data
        uses: actions/cache@v4
        with:
          path: cache
          key: baostock-cache-${{ steps.cachedate.outputs.ymd }}
          restore-keys: |
            baostock-cache-

      - name: Purge restored quote cache
        run: |
          # 删除「恢复回来的」行情类缓存（daily_/weekly_/index_daily_）：
          # 这三类的新鲜度由文件 mtime 判定（_cache_fresh_today），复用与否取决于
          # actions/cache 是否保留了 mtime —— 实盘推荐的正确性不应建立在这个假设上。
          # 删除不影响本 workflow 的策略间共享：同一 runner 上先跑的抄底会全量拉取
          # 并重新写入当天行情，随后突破步骤直接读同一份文件（共享正是发生在这里）。
          # 保留 stock_list(6天) / fund_v2(7天) / industry(30天) / market_regime_state.json：
          # 它们是真正时间不敏感的数据，用 TTL 判定、与 mtime 无关，跨天复用是正确且必要的
          # （基本面每天约 6000 次查询，正是靠 7 天 TTL 才不必重跑）。
          if [ -d cache ]; then
            before=$(find cache -maxdepth 1 -type f | wc -l)
            find cache -maxdepth 1 -type f \( -name 'daily_*' -o -name 'weekly_*' -o -name 'index_daily_*' \) -delete
            after=$(find cache -maxdepth 1 -type f | wc -l)
            echo "cache/ 原有 $before 个文件；清除恢复的行情缓存 $((before-after)) 个，剩余 $after 个（股票列表/基本面/行业/regime 状态保留）"
          else
            echo "cache/ 目录不存在：首次运行或缓存已过期淘汰"
          fi

      - name: Run bottom-fishing strategy
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          # Baostock 的 query_all_stock(day=...) 与缓存「当天」判断依赖本地日期；
          # 用北京时间避免 UTC 时区在跨日边界产生偏差（也保证同日两次运行判定一致）
          TZ: Asia/Shanghai
          # 关闭 stdout 缓冲：否则 Python 输出按块缓冲，任务超时/取消后缓冲的日志全部丢失
          PYTHONUNBUFFERED: "1"
          # 定时任务现在【使用】磁盘缓存（不再强制 --no-cache）：
          # 这是共享当日行情的前提——抄底必须把当天日线/基本面写入 cache/，
          # 同一 runner 上的突破步骤才能零重拉复用。过期风险由上面的
          # Purge restored quote cache 步骤承担（行情类缓存一律不作为复用来源）。
          # 只有手动触发勾选 no_cache 时才强制全量拉取。
          NO_CACHE: ${{ inputs.no_cache }}
        run: |
          if [ "$NO_CACHE" = "true" ]; then
            echo "::notice::手动触发已勾选 no_cache：抄底与突破均跳过 cache/，全部从数据源拉取（本次不共享）"
            python -u run.py --no-cache
          else
            echo "::notice::抄底策略开始（写入当天行情缓存，供随后的突破策略复用）"
            python -u run.py
          fi

      # if: always() —— 抄底失败/异常时突破仍要执行：两套策略是独立信号源，
      # 不应互相阻塞。抄底未写出的缓存由突破自行补拉（慢但结果正确）。
      - name: Run breakout strategy
        if: always() && inputs.skip_breakout != true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          TZ: Asia/Shanghai
          PYTHONUNBUFFERED: "1"
          NO_CACHE: ${{ inputs.no_cache }}
          BREAKOUT_NO_SAVE: ${{ inputs.breakout_no_save }}
          BREAKOUT_NO_NOTIFY: ${{ inputs.breakout_no_notify }}
        run: |
          ARGS=""
          if [ "$NO_CACHE" = "true" ]; then ARGS="$ARGS --no-cache"; fi
          if [ "$BREAKOUT_NO_SAVE" = "true" ]; then
            ARGS="$ARGS --no-save"
            echo "::notice::已勾选 breakout_no_save：本次跳过 MySQL 落库"
          fi
          if [ "$BREAKOUT_NO_NOTIFY" = "true" ]; then
            ARGS="$ARGS --no-notify"
            echo "::notice::已勾选 breakout_no_notify：本次跳过飞书通知"
          fi
          # 组合层去重（fetch_rec_codes_for_date 剔除当日已被抄底推荐的个股）
          # 依赖运行顺序，本步骤排在抄底之后即为顺序保证
          echo "::notice::突破策略开始（复用抄底写下的当天行情缓存）：run_breakout.py $ARGS"
          python -u run_breakout.py $ARGS

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screening-data-${{ github.run_number }}
          path: |
            data/
            cache/market_regime_state.json
          if-no-files-found: ignore
          retention-days: 30
